<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account – Acme</title>
  <style>
    body {
      font: 1rem/1.6 system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
      box-sizing: border-box;
    }

    .content { max-width: 40rem; }

    /* The notification. Sits at the bottom, styled only when it has content
       so an empty region leaves no visible box behind. */
    .notification:not(:empty) {
      border: 1px solid #1a6b3c;
      border-left-width: 4px;
      background: #eef7f1;
      color: #14522e;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      max-width: 40rem;
    }

    button {
      font: inherit;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid #1a4fd6;
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <div class="content">
    <p>Welcome to Acme. Sign in to see your projects and recent activity.</p>
    <button type="button" id="login">Sign in</button>
  </div>

  <!--
    Present in the DOM from first paint, and empty.
    Screen readers attach to the region on load; if the element itself were
    created at the same moment as its text, many browser/reader pairs would
    stay silent. role="status" implies aria-live="polite" and
    aria-atomic="true", so nothing else is needed here.
  -->
  <div class="notification" id="login-status" role="status"></div>

  <script>
    document.getElementById('login').addEventListener('click', function () {
      var status = document.getElementById('login-status');

      // Clearing first lets the same message announce again on a repeat login.
      status.textContent = '';

      // Small delay gives the reader time to register the mutation.
      setTimeout(function () {
        status.textContent = 'Signed in as anna@example.com';
      }, 150);
    });
  </script>

</body>
</html>
